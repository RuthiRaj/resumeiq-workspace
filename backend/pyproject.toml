[project]
name = "resumeiq-backend"
version = "0.1.0"
description = "ResumeIQ Workspace backend (FastAPI) — milestone B0 scaffold."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30,<0.35",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<0.29",
  "pyjwt[crypto]>=2.10,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<0.10",
  "mypy>=1.11,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<0.10",
  "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]
# " – " and " · " are intentional: the standard-resume text must match the F3
# mock derivation character-for-character (frontend/src/mocks/workspace-store.ts).
allowed-confusables = ["–", "·"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
